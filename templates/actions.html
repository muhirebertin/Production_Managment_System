{# actions.html: the View / Edit / Delete buttons used in every table. #}
{# The page builds the three links with {% url ... as view_url %} and then includes this file. #}
<td class="actions">
  <a href="{{ view_url }}" class="btn btn-info btn-sm"><i class="fas fa-eye mr-1"></i>View</a>
  <a href="{{ edit_url }}" class="btn btn-warning btn-sm"><i class="fas fa-edit mr-1"></i>Edit</a>
  <a href="{{ delete_url }}" class="btn btn-danger btn-sm"><i class="fas fa-trash mr-1"></i>Delete</a>
</td>
