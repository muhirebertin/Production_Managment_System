{% extends "base.html" %}
<!-- confirm_delete.html: confirmation step before deleting any record -->

{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-6">
    <div class="card card-danger">
      <div class="card-header"><h3 class="card-title"><i class="fas fa-exclamation-triangle mr-1"></i> Are you sure?</h3></div>
      <div class="card-body">
        <p>You are about to delete: <strong>{{ object }}</strong></p>
        <p class="text-muted mb-0">This action cannot be undone.</p>
      </div>
      <div class="card-footer">
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="fas fa-trash mr-1"></i> Yes, delete</button>
          <a href="{% url cancel_url %}" class="btn btn-default">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
